# St Mary's — self-hosted n8n (Community Edition)
# Copy to your VPS: ~/n8n/docker-compose.yml
# Requires: .env file (see .env.example)

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - GENERIC_TIMEZONE=Europe/London
      - TZ=Europe/London
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DISABLE_IPV6=true
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # Community Edition: no UI Variables — pass config via env (use $env in workflow)
      - SUPABASE_URL=${SUPABASE_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_EMAIL_CC=${ADMIN_EMAIL_CC}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  web:
